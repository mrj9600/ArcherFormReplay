<div class="review-page">
  @if (clipStore.clip(); as clip) {
    <video #player [src]="clip.url" controls playsinline class="player"></video>

    @if (settingsService.settings().autoplayDelaySeconds > 0) {
      <p class="autoplay-hint">Auto-playing in {{ settingsService.settings().autoplayDelaySeconds }}s…</p>
    }

    <div class="rate-control">
      <label for="rate">
        <mat-icon>speed</mat-icon>
        Playback speed: {{ playbackRate() }}x
      </label>
      <input
        id="rate"
        type="range"
        min="0.1"
        max="1"
        step="0.05"
        [value]="playbackRate()"
        (input)="onRateInput($event)"
      />
    </div>
  } @else {
    <div class="empty-state">
      <mat-icon>movie</mat-icon>
      <p>No clip yet — go to Record and trigger a shot.</p>
    </div>
  }
</div>
