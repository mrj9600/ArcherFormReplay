<div class="sync-clock">
  <div #readout class="readout">00.000</div>
  <p class="hint">
    Point all cameras at this screen and take a shot. In Review, pause at one timeline position:
    every camera should show the same reading. A camera that consistently shows an earlier reading
    runs behind - enter that difference (ms) as its timing offset in Settings.
  </p>
</div>
