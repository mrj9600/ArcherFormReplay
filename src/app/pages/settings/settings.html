<div class="settings-page">
  <div class="setting">
    <label for="preRoll">
      <mat-icon>history</mat-icon>
      Pre-roll: {{ settingsService.settings().preRollSeconds }}s before release
    </label>
    <input
      id="preRoll"
      type="range"
      min="0.5"
      max="10"
      step="0.5"
      [value]="settingsService.settings().preRollSeconds"
      (input)="onPreRollInput($event)"
    />
  </div>

  <div class="setting">
    <label for="postRoll">
      <mat-icon>update</mat-icon>
      Post-roll: {{ settingsService.settings().postRollSeconds }}s after release
    </label>
    <input
      id="postRoll"
      type="range"
      min="0.5"
      max="10"
      step="0.5"
      [value]="settingsService.settings().postRollSeconds"
      (input)="onPostRollInput($event)"
    />
  </div>

  <div class="setting">
    <label for="sensitivity">
      <mat-icon>graphic_eq</mat-icon>
      Mic sensitivity threshold: {{ settingsService.settings().micSensitivity }}
    </label>
    <input
      id="sensitivity"
      type="range"
      min="0.01"
      max="0.3"
      step="0.005"
      [value]="settingsService.settings().micSensitivity"
      (input)="onSensitivityInput($event)"
    />
    <p class="hint">Lower = more sensitive (triggers on quieter sounds). Adjust while watching the mic level meter on the Record page.</p>
  </div>

  <div class="setting">
    <label for="autoplay">
      <mat-icon>play_circle</mat-icon>
      @if (settingsService.settings().autoplayDelaySeconds > 0) {
        Auto-play: {{ settingsService.settings().autoplayDelaySeconds }}s after clip is ready
      } @else {
        Auto-play: off (play manually)
      }
    </label>
    <input
      id="autoplay"
      type="range"
      min="0"
      max="10"
      step="0.5"
      [value]="settingsService.settings().autoplayDelaySeconds"
      (input)="onAutoplayDelayInput($event)"
    />
  </div>
</div>
